version: '3.8'

services:
  sentinel-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: always

  sentinel-frontend:
    image: node:20-alpine
    container_name: sentinel-soc-dashboard
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - sentinel-backend
    restart: always
